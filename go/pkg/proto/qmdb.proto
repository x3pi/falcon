syntax = "proto3";

// Định nghĩa package để tránh xung đột tên
package qmdb;

option go_package = "/proto";

// Khai báo service gRPC
service QmdbService {
  // RPC để ghi dữ liệu
  rpc Write (WriteRequest) returns (WriteResponse);
  // RPC để đọc dữ liệu
  rpc Read (ReadRequest) returns (ReadResponse);
}

// ---- Định nghĩa các message (cấu trúc dữ liệu) ----

message WriteRequest {
  string key = 1;
  string value = 2;
}

message WriteResponse {
  bool success = 1;
  string message = 2;
}

message ReadRequest {
  string key = 1;
}

message ReadResponse {
  bool found = 1;
  string value = 2;
  string message = 3;
}