[package]
name = "crypto"
version = "0.1.0"
authors = ["Alberto Sonnino <alberto@sonnino.com>"]
edition = "2018"
publish = false

[dependencies]
tokio = { version = "1.3.0", features = ["sync", "rt", "macros"] }
serde = { version = "1.0", features = ["derive"] }
rand = "0.7.3"
base64 = "0.13.0"
threshold_crypto = { version = "0.4", git = "https://github.com/poanetwork/threshold_crypto" }
sha3 = "0.10.1"
libsecp256k1 = "0.6.0"
hex = "0.4.3"

[dev-dependencies]
